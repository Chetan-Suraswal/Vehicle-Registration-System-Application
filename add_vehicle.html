<link rel="stylesheet" href="add_vehicle.css">

<div class="container">
    <h1>Vehicle Registration Form</h1>
    <p class="subtitle">Fill all required details carefully</p>

    <form id="vehicleForm">

        <!-- Owner Details -->
        <h2 class="form_title">Owner Information</h2>
        <div class="form-group">
            <label>Owner Full Name</label>
            <input id="ownerName" type="text" placeholder="Enter full name">
        </div>

        <div class="form-group">
            <label>Mobile Number</label>
            <input id="ownerMobile" type="tel" placeholder="Enter mobile number">
        </div>

        <div class="form-group">
            <label>Email Address</label>
            <input id="ownerEmail" type="email" placeholder="Enter email">
        </div>

        <div class="form-group">
            <label>Full Address</label>
            <textarea id="ownerAddress" placeholder="Enter complete address"></textarea>
        </div>








        <!-- Vehicle Details -->
        <h2 class="form_title">Vehicle Details</h2>
        <div class="form-group">
            <label>Vehicle Type</label>
            <select id="vehicleType">
                <option>Select vehicle type</option>
                <option>Two Wheeler</option>
                <option>Four Wheeler</option>
                <option>Commercial</option>
            </select>
        </div>

        <div class="form-group">
            <label>Vehicle Brand</label>
            <input id="vehicleBrand" type="text" placeholder="e.g. Honda, Tata">
        </div>

        <div class="form-group">
            <label>Vehicle Model</label>
            <input id="vehicleModel" type="text" placeholder="Enter model name">
        </div>

        <div class="form-group">
            <label>Engine Number</label>
            <input id="engineNumber" type="text" placeholder="Enter engine number">
        </div>

        <div class="form-group">
            <label>Chassis Number</label>
            <input id="chassisNumber" type="text" placeholder="Enter chassis number">
        </div>








        <!-- Insurance -->
        <h2 class="form_title">Insurance Details</h2>
        <div class="form-group">
            <label>Insurance Company</label>
            <input id="insuranceCompany" type="text" placeholder="Enter insurance company">
        </div>

        <div class="form-group">
            <label>Policy Number</label>
            <input id="policyNumber" type="text" placeholder="Enter policy number">
        </div>







        <!-- Documents -->
        <h2 class="form_title">Document Details</h2>
        <div class="form-group">
            <label>Adhaar Card Number</label>
            <input id="aadhaarNumber" type="text" placeholder="Enter insurance company">
        </div>

        <div class="form-group">
            <label>Vehicle Invoice Number</label>
            <input id="invoiceNumber" type="text" placeholder="Enter policy number">
        </div>






        <!-- Declaration
        <div class="checkbox">
            <input type="checkbox">
            <label>I hereby declare that all the information provided is correct.</label>
        </div> -->

        <div class="checkbox">
            <input type="checkbox" id="declare">
            <label for="declare">
                I hereby declare that all the information provided is correct.
            </label>
        </div>

        <!-- Buttons -->
        <div class="buttons">
            <button type="submit">Submit Registration</button>
            <button type="reset" class="reset">Reset</button>
        </div>

    </form>


</div>
