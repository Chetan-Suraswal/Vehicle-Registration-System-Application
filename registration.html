<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Sign Up</title>
    <link rel="stylesheet" href="registration.css">
</head>

<body>

    <div class="container">
        <h2>Sign Up</h2>
        <p class="subtitle">Create your account</p>

        <input type="text" id="name" placeholder="Full Name" required>
        <input type="email" id="email" placeholder="Email" required>


        <div class="password-box">
            <input type="password" id="password" placeholder="Password" required>
            <span class="eye" data-target="password">👁</span>
        </div>

        <div class="password-box">
            <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
            <span class="eye" data-target="confirmPassword">👁</span>
        </div>

        <button id="registerBtn">Sign Up</button>

        <p id="msg" class="error"></p>

        <p class="bottom-text">
            Already have an account?
            <a href="login.html">Login</a>
        </p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword }
            from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc }
            from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBhhi1H4y9V6U5ZMYceKB1Bk0YYoS5Fzco",
            authDomain: "notes757575.firebaseapp.com",
            projectId: "notes757575",
            storageBucket: "notes757575.firebasestorage.app",
            messagingSenderId: "521967825245",
            appId: "1:521967825245:web:b4c77570190bfd611878b4"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        document.getElementById("registerBtn").onclick = async () => {
            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;
            const msg = document.getElementById("msg");

            msg.innerText = "";

            if (!name || !email || !password || !confirmPassword) {
                msg.innerText = "All fields are required";
                return;
            }

            if (password !== confirmPassword) {
                msg.innerText = "Passwords do not match";
                return;
            }

            try {
                const cred = await createUserWithEmailAndPassword(auth, email, password);

                const userId = "VRS-USER-" + Math.floor(10000 + Math.random() * 90000);

                await setDoc(doc(db, "users", cred.user.uid), {
                    userId,
                    fullName: name,
                    email,
                    createdAt: new Date()
                });

                localStorage.setItem("loggedIn", "true");
                localStorage.setItem("userId", userId);

                window.location.href = "login.html";

            } catch (error) {
                msg.innerText = error.message;
            }
        };

        document.querySelectorAll(".eye").forEach(eye => {
            eye.addEventListener("click", () => {
                const targetId = eye.getAttribute("data-target");
                const input = document.getElementById(targetId);

                if (input.type === "password") {
                    input.type = "text";
                    eye.textContent = "🙈";
                } else {
                    input.type = "password";
                    eye.textContent = "👁";
                }
            });
        });

    </script>
